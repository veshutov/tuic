[workspace]
resolver = "3"
members = ["client", "server", "common"]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }

tun-rs = { version = "2.8.6", features = ["async", "async_framed"] }
default-net = "0.22.0"
etherparse = "0.20.2"
quinn = { version = "0.11.11", features = ["rustls-aws-lc-rs", "rustls-ring"] }
rustls = "0.23.41"
rcgen = "0.14.8"
bytes = "1.12.0"

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
dashmap = "6.2.1"
config = "0.15.25"
anyhow = "1.0.103"
